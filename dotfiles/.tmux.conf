set -g mouse off

# Command prefix (like screen)
set -g prefix C-a
bind C-a send-prefix

# Basic settings
set-window-option -g mode-keys vi # vi key

# Clock
set-window-option -g clock-mode-colour cyan
set-window-option -g clock-mode-style 24

set-option -g status-keys vi

# Window title
set-option -g set-titles on
set-option -g set-titles-string '#S:#I.#P #W' # window number,program name,active (or not)
# Auto-name windows to "app last/three/dirs". A manual `prefix ,` rename
# disables automatic-rename for that window, so the chosen name sticks forever.
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format '#{pane_current_command} #(echo "#{pane_current_path}" | rev | cut -d/ -f-3 | rev)'

# No visual bell (activity is enabled below)
set -g visual-bell off

# Zoom indicator for the status bar
wg_is_zoomed="#{?window_zoomed_flag,🔍,}"

# Status bar
set-option -g status on
set-option -g status-position top
set-option -g status-bg "colour235"
set-option -g status-fg "colour252"
set-option -g status-justify "centre"
set-option -g status-left-length 60
set-option -g status-right-length 90
set-option -g status-left  "#(~/.config/tmux/status-left.sh) $wg_is_zoomed"
set-option -g status-right "#(~/.config/tmux/status-right.sh)"
set-option -g visual-activity on

# Bar
set-window-option -g window-status-separator " "

## Display the window name (#W), which automatic-rename-format keeps as
## "app dir" until you manually rename a window, after which it stays put.
set-window-option -g window-status-current-format '#[bold][#W]'
set-window-option -g window-status-format ' #W '

### SHORTCUTS

bind + split-window -h # horizontal split
bind _ split-window -v # vertical split

# Tabs control
bind -n C-t prev
bind -n C-y next

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R



# Copy mode to / key
unbind [
bind / copy-mode

# Move tmux copy buffer into x clipboard
bind-key C-y save-buffer /tmp/tmux-buffer \; run-shell "cat /tmp/tmux-buffer | xclip"

# For Claude
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
